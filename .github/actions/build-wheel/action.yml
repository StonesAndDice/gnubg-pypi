name: Build & test wheels
description: Build and test a Python wheel using cibuildwheel

inputs:
  python:
    required: true
    description: Python ABI tag (PEP 425)
  os:
    required: true
    description: GitHub Actions runner OS

runs:
  using: "composite"
  steps:
    - name: Install system dependencies (Linux)
      if: ${{ inputs.os == 'ubuntu-latest' }}
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          autoconf automake \
          pkg-config \
          python3.12-dev \
          libglib2.0-dev \
          libreadline-dev \
          libgmp-dev \
          libsqlite3-dev \
          libpng-dev \
          libgtk-3-dev \
          libssl-dev \
          zlib1g-dev

    - name: Install system dependencies (macOS)
      if: ${{ startsWith(inputs.os, 'macos') }}
      shell: bash
      run: |
        brew update
        brew install pkg-config glib readline gmp sqlite libpng
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> $GITHUB_ENV
        echo "LDFLAGS=-L$(brew --prefix)/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
        echo "CFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV

    - name: Install system dependencies (Windows)
      if: ${{ inputs.os == 'windows-latest' }}
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-pkg-config
          mingw-w64-ucrt-x86_64-glib2
          mingw-w64-ucrt-x86_64-gmp
          mingw-w64-ucrt-x86_64-readline
          mingw-w64-ucrt-x86_64-sqlite3
          mingw-w64-ucrt-x86_64-libpng
          mingw-w64-ucrt-x86_64-gettext

    - name: Set MSYS2 env for PowerShell (Windows)
      if: ${{ inputs.os == 'windows-latest' }}
      shell: pwsh
      run: |
        $msys2Root = "${{ steps.msys2.outputs.msys2-location }}"
        $ucrt64 = Join-Path $msys2Root "ucrt64"
        "PATH=$ucrt64\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
        "PKG_CONFIG_PATH=$ucrt64\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Install Meson
      if: ${{ inputs.os == 'ubuntu-latest' || startsWith(inputs.os, 'macos') }}
      shell: bash
      run: pip install meson ninja cibuildwheel

    - name: Build with meson
      if: ${{ inputs.os == 'ubuntu-latest' || startsWith(inputs.os, 'macos') }}
      shell: bash
      run: |
        meson setup build
        meson compile -C build

    - name: Clean build dir before cibuildwheel
      if: ${{ inputs.os == 'ubuntu-latest' || startsWith(inputs.os, 'macos') }}
      shell: bash
      run: rm -rf build

    - name: Build wheels
      if: ${{ inputs.os == 'ubuntu-latest' || startsWith(inputs.os, 'macos') }}
      shell: bash
      env:
        CIBW_SKIP: "pp* *-win32"
        CIBW_BUILD: "${{ inputs.python }}-*"
        CIBW_ARCHS_MACOS: "native"
        CIBW_PLATFORM: ${{ inputs.os == 'ubuntu-latest' && 'linux' || (startsWith(inputs.os, 'macos') && 'macos') || (inputs.os == 'windows-latest' && 'windows') }}
        CIBW_BEFORE_BUILD: ${{ inputs.os == 'ubuntu-latest' && '( dnf install -y readline-devel ncurses-devel glib2-devel gmp-devel sqlite-devel libpng-devel pkg-config 2>/dev/null ) || ( apk add --no-cache readline-dev ncurses-dev glib-dev gmp-dev sqlite-dev libpng-dev pkgconfig )' || '' }}
        CIBW_TEST_REQUIRES: "pytest"
        CIBW_TEST_COMMAND: "pytest {project}/tests"
        # Match Homebrew dylibs (built for the runner's macOS, 15.0) so delocate accepts the wheel
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CIBW_ENVIRONMENT_LINUX: >
          LDFLAGS="-L$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))') $LDFLAGS"
          CPPFLAGS="-I$(python -c 'import sysconfig; print(sysconfig.get_path("include"))') $CPPFLAGS"
        # auditwheel, but with GLib bundled too (the manylinux policies assume
        # the system has it; slim images don't). See tools/repair_wheel_linux.py.
        CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
          pip install auditwheel==6.8.2 &&
          python {project}/tools/repair_wheel_linux.py -w {dest_dir} {wheel}
      run: cibuildwheel --output-dir wheelhouse

    - name: Test the wheels on systems without GLib (Linux)
      if: ${{ inputs.os == 'ubuntu-latest' }}
      shell: bash
      run: |
        # cibuildwheel's own test runs in the build container, which has the
        # build dependencies; install the wheels in clean images too (issue #19).
        py="${{ inputs.python }}"
        version="${py:2:1}.${py:3}"
        for image in "python:${version}-slim" "python:${version}-alpine"; do
          echo "::group::${image}"
          docker run --rm \
            -v "$PWD/wheelhouse:/wheelhouse:ro" -v "$PWD/tools:/tools:ro" \
            "${image}" sh -ec \
            "pip install --quiet --no-index --find-links /wheelhouse gnubg && python /tools/check_wheel_import.py"
          echo "::endgroup::"
        done

    - name: Install Meson
      if: ${{ inputs.os == 'windows-latest' }}
      shell: pwsh
      run: pip install meson ninja cibuildwheel

    - name: Build with meson
      if: ${{ inputs.os == 'windows-latest' }}
      shell: pwsh
      run: |
        meson setup build
        meson compile -C build

    - name: Clean build dir before cibuildwheel
      if: ${{ inputs.os == 'windows-latest' }}
      shell: pwsh
      run: Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

    - name: Build wheels
      if: ${{ inputs.os == 'windows-latest' }}
      shell: pwsh
      env:
        CIBW_SKIP: "pp* *-win32"
        CIBW_BUILD: "${{ inputs.python }}-*"
        CIBW_ARCHS_MACOS: "native"
        CIBW_PLATFORM: ${{ inputs.os == 'ubuntu-latest' && 'linux' || (startsWith(inputs.os, 'macos') && 'macos') || (inputs.os == 'windows-latest' && 'windows') }}
        CIBW_TEST_REQUIRES: "pytest"
        CIBW_TEST_COMMAND: "pytest {project}/tests"
      run: cibuildwheel --output-dir wheelhouse

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ inputs.os }}-py${{ inputs.python }}
        path: wheelhouse/*.whl
